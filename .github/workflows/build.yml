name: Build and verify Windows audio
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build, test, and package
        shell: powershell
        run: .\scripts\Build.ps1 -Zip
      - uses: actions/upload-artifact@v4
        with:
          name: CLEARCAST-Audio-Windows-x64
          path: |
            artifacts/CLEARCAST-Audio-Windows-x64.zip
            artifacts/test-results/
